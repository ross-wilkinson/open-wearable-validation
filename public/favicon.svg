<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="owv-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a101d" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="owv-cyan" x1="7" y1="11" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="owv-gold" x1="7" y1="25" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle container -->
  <rect width="36" height="36" rx="8" fill="url(#owv-bg)" />
  <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="7.25" stroke="rgba(56, 189, 248, 0.28)" stroke-width="0.75" />

  <!-- Bland-Altman Limits of Agreement bounds -->
  <line x1="7" y1="9.5" x2="29" y2="9.5" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="7" y1="26.5" x2="29" y2="26.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Zero Bias Center Reference -->
  <line x1="6" y1="18" x2="30" y2="18" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Caliper Jaw Brackets -->
  <path d="M 9 7.5 L 6.5 7.5 L 6.5 28.5 L 9 28.5" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 27 7.5 L 29.5 7.5 L 29.5 28.5 L 27 28.5" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dual Confidence Convergence Envelopes -->
  <path d="M 7.5 11.5 C 13.5 12.8, 19.5 16.2, 27 17.5" stroke="url(#owv-cyan)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 7.5 24.5 C 13.5 23.2, 19.5 19.8, 27 18.5" stroke="url(#owv-gold)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Vernier Calibration Ticks -->
  <line x1="13" y1="16.5" x2="13" y2="19.5" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />
  <line x1="20" y1="16.5" x2="20" y2="19.5" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />

  <!-- Ground Truth Focal Reticle -->
  <circle cx="27.5" cy="18" r="3" fill="#0a101d" stroke="#eda100" stroke-width="1.4" />
  <circle cx="27.5" cy="18" r="1.1" fill="#ffffff" />
</svg>
